services:
  # ---------------------------------------------------------------------------
  # SQL Server 2022
  # ---------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: helpdesk-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - helpdesk-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g

  # ---------------------------------------------------------------------------
  # RabbitMQ
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: helpdesk-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - helpdesk-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # API Gateway (YARP) — single entry point for the frontend
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: helpdesk-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_SERVICE_NAME: helpdesk-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "5000:8080"
    depends_on:
      - identity-service
      - ticket-service
      - notification-service
      - search-service
      - otel-collector
    networks:
      - helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Identity Service (internal — gateway routes /api/auth/* here)
  # ---------------------------------------------------------------------------
  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    container_name: helpdesk-identity-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=${MSSQL_DATABASE};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__PrivateKeyPath: /app/certs/private.pem
      Jwt__PublicKeyPath: /app/certs/public.pem
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__AccessTokenExpiryMinutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES}
      Jwt__RefreshTokenExpiryDays: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS}
      NOTIFICATION_SERVICE_KEY: ${NOTIFICATION_SERVICE_KEY}
      OTEL_SERVICE_NAME: helpdesk-identity-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "5010:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      otel-collector:
        condition: service_started
    volumes:
      - ./infra/certs:/app/certs:ro
    networks:
      - helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Ticket Service (internal — gateway routes /api/tickets/* here)
  # ---------------------------------------------------------------------------
  ticket-service:
    build:
      context: ./services/ticket-service
      dockerfile: Dockerfile
    container_name: helpdesk-ticket-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=TicketDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__PublicKeyPath: /app/certs/public.pem
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__ExchangeName: ticket.events
      Outbox__BatchSize: "20"
      Outbox__PollIntervalSeconds: "5"
      AI_SERVICE_KEY: ${AI_SERVICE_KEY}
      SEARCH_SERVICE_KEY: ${SEARCH_SERVICE_KEY}
      OTEL_SERVICE_NAME: helpdesk-ticket-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "5011:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    volumes:
      - ./infra/certs:/app/certs:ro
      - ticket-uploads:/app/uploads
    networks:
      - helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # PostgreSQL (notification service)
  # ---------------------------------------------------------------------------
  notification-postgres:
    image: postgres:16-alpine
    container_name: helpdesk-notification-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: NotificationDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    networks:
      - helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d NotificationDb"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Mailpit (dev email)
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: helpdesk-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - helpdesk-network

  # ---------------------------------------------------------------------------
  # Notification Service
  # ---------------------------------------------------------------------------
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: helpdesk-notification-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=notification-postgres;Port=5432;Database=NotificationDb;Username=postgres;Password=postgres"
      Jwt__PublicKeyPath: /app/certs/public.pem
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__ExchangeName: ticket.events
      Email__SmtpHost: mailpit
      Email__SmtpPort: "1025"
      NOTIFICATION_SERVICE_KEY: ${NOTIFICATION_SERVICE_KEY}
      OTEL_SERVICE_NAME: helpdesk-notification-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "5012:8080"
    depends_on:
      notification-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    volumes:
      - ./infra/certs:/app/certs:ro
    networks:
      - helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Ollama (local LLM + embeddings for the AI service)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: helpdesk-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Qdrant (vector store for the AI service)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: helpdesk-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------------
  # AI Service (RAG chat, ticket/KB indexing — gateway routes /api/ai/* here)
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: helpdesk-ai-service
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ticket.events
      INDEX_QUEUE: ai-index.q
      COLLECTION_NAME: helpdesk_index
      AI_CHAT_MODEL: llama3.2:3b
      AI_EMBEDDING_MODEL: nomic-embed-text
      JWT_PUBLIC_KEY_PATH: /app/certs/public.pem
      JWT_ISSUER: ${JWT_ISSUER}
      TICKET_SERVICE_BASE_URL: http://ticket-service:8080
      AI_SERVICE_KEY: ${AI_SERVICE_KEY}
      OTEL_SERVICE_NAME: helpdesk-ai-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "5090:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./infra/certs:/app/certs:ro
      - ai-data:/data
    networks:
      - helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Meilisearch (keyword/full-text index for closed tickets)
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: helpdesk-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7700/health | grep -q available"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Search Service (Meilisearch projection — gateway routes /api/search/* here)
  # ---------------------------------------------------------------------------
  search-service:
    build:
      context: ./services/search-service
      dockerfile: Dockerfile
    container_name: helpdesk-search-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__PublicKeyPath: /app/certs/public.pem
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__ExchangeName: ticket.events
      Meilisearch__Url: http://meilisearch:7700
      TicketService__BaseUrl: http://ticket-service:8080
      SearchService__ServiceKey: ${SEARCH_SERVICE_KEY}
    ports:
      - "5013:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
    volumes:
      - ./infra/certs:/app/certs:ro
    networks:
      - helpdesk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Jaeger (distributed tracing)
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: helpdesk-jaeger
    restart: unless-stopped
    command: ["--config", "/etc/jaeger/jaeger.yml"]
    volumes:
      - ./infra/jaeger/jaeger.yml:/etc/jaeger/jaeger.yml:ro
    ports:
      - "16686:16686"   # Jaeger UI
    networks:
      - helpdesk-network

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector (metrics pipeline)
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: helpdesk-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector/otel-collector.yml"]
    volumes:
      - ./infra/otel-collector/otel-collector.yml:/etc/otel-collector/otel-collector.yml:ro
    ports:
      - "8889:8889"     # Prometheus metrics export
    networks:
      - helpdesk-network

  # ---------------------------------------------------------------------------
  # Prometheus (metrics)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: helpdesk-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - helpdesk-network

  # ---------------------------------------------------------------------------
  # Grafana (dashboards)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.2
    container_name: helpdesk-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - helpdesk-network

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    container_name: helpdesk-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - helpdesk-network

volumes:
  sqlserver-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  ticket-uploads:
  notification-postgres-data:
  ollama-data:
  qdrant-data:
  ai-data:
  meilisearch-data:

networks:
  helpdesk-network:
    driver: bridge
    driver_opts:
      # The host's path MTU to the internet is < 1500 (verified: 1500-byte
      # packets are dropped, 1478 passes). The default bridge MTU of 1500
      # causes large downloads (e.g. Ollama model blobs from Cloudflare R2) to
      # stall mid-stream. Set the bridge MTU below the path limit so sustained
      # transfers work from inside containers.
      com.docker.network.driver.mtu: 1450
